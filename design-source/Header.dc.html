<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header — The Craft Brewery</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/35a35548b87b64c969ab7ab13d4e4c06">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Serif+Display:ital@0;1&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:transparent}</style>
</helmet>
<div style="font-family: var(--fb); color: var(--white)">
  <header class="{{ hdrClass }}">
    <div class="wrap hdr-in">
      <a class="brand" href="Main.dc.html" aria-label="The Craft Brewery, home">
        <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="none" stroke="#A58A61" stroke-width="1.2"></circle><circle cx="22" cy="22" r="17.5" fill="none" stroke="#A58A61" stroke-width=".6" stroke-dasharray="1.5 2.5"></circle><path d="M22 10.5v3.2" stroke="#D08E60" stroke-width="1.6" stroke-linecap="round"></path><path d="M22 13.6c-4.4 2.6-5.4 9.4-0.1 17.6 5.3-8.2 4.4-15 .1-17.6z" fill="none" stroke="#D08E60" stroke-width="1.6" stroke-linejoin="round"></path><path d="M18.4 18.2 22 20.4l3.6-2.2M17.8 22.6 22 25.2l4.2-2.6M19.2 27.2 22 29l2.8-1.8" fill="none" stroke="#D08E60" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span class="wm"><small>The</small><b>Craft Brewery</b></span>
      </a>
      <nav class="nav" aria-label="Main">
        <sc-for list="{{ items }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" aria-current="{{ n.cur }}">{{ n.label }}</a>
        </sc-for>
      </nav>
      <a class="btn btn-copper btn-sm hdr-cta" href="Visit.dc.html">Plan Your Visit</a>
      <button type="button" class="icon-btn menu-btn" style="margin-left: auto" aria-label="Open menu" aria-expanded="{{ openStr }}" aria-controls="drawer" onClick="{{ open }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 7h18M3 12h18M9 17h12"></path></svg>
      </button>
    </div>
  </header>

  <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
    <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Site menu" onKeyDown="{{ onKey }}">
      <button type="button" class="scrim" tabindex="-1" aria-label="Close menu" onClick="{{ close }}"></button>
      <div class="drawer-panel grain">
        <div class="between" style="align-items: center">
          <span class="brand"><span class="wm"><small>The</small><b>Craft Brewery</b></span></span>
          <button type="button" class="icon-btn" aria-label="Close menu" autofocus onClick="{{ close }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </div>
        <nav aria-label="Main (mobile)">
          <sc-for list="{{ items }}" as="n" hint-placeholder-count="6">
            <a href="{{ n.href }}" aria-current="{{ n.cur }}" onClick="{{ close }}"><span>{{ n.label }}</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
          </sc-for>
        </nav>
        <a class="btn btn-copper" href="Visit.dc.html" onClick="{{ close }}">Plan Your Visit</a>
        <div class="stack small" style="gap: 4px; margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line-d); color: var(--oat)">
          <span>4827 Aspen Street, Bend, OR 97701</span>
          <a href="mailto:thecraftbrewery@outlook.com" style="min-height: 44px; display: inline-flex; align-items: center; text-decoration: none">thecraftbrewery@outlook.com</a>
          <span class="xs muted">For adults 21+. Please drink responsibly.</span>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","products","story","process","gallery","visit"],"default":"home"},"overlay":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":88}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: false, scrolled: false }; this.onScroll = this.onScroll.bind(this); }
  componentDidMount() { window.addEventListener('scroll', this.onScroll, { passive: true }); this.onScroll(); }
  componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); }
  onScroll() { const s = (window.scrollY || 0) > 40; if (s !== this.state.scrolled) this.setState({ scrolled: s }); }
  renderVals() {
    const a = this.props.active ?? 'home';
    const overlay = this.props.overlay ?? true;
    const NAV = [['home', 'Home', 'Main.dc.html'], ['products', 'Our Products', 'Products.dc.html'], ['story', 'Our Story', 'Story.dc.html'], ['process', 'Brewing Process', 'Process.dc.html'], ['gallery', 'Gallery', 'Gallery.dc.html'], ['visit', 'Visit Us', 'Visit.dc.html']];
    const close = () => this.setState({ open: false });
    return {
      hdrClass: 'hdr ' + (this.state.scrolled || !overlay ? 'solid' : 'overlay'),
      items: NAV.map(([k, label, href]) => ({ label, href, cur: k === a ? 'page' : undefined })),
      isOpen: this.state.open, openStr: this.state.open ? 'true' : 'false',
      open: () => this.setState({ open: true }), close,
      onKey: (e) => { if (e.key === 'Escape') close(); },
    };
  }
}
</script>
</body>
</html>
